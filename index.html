<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <!-- Подключаем Telegram API -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4);
            transition: transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        p {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>XRP G PRO TV</h2>
    <p>Нажмите на кнопку ниже, чтобы запустить видео во встроенной шторке Telegram!</p>

    <!-- Используем специальный формат ссылки t.me/bg_browser_bot, которая заставляет Android открывать встроенный плеер Telegram -->
    <a href="https://t.me" class="btn" id="watch-link">▶ СМОТРЕТЬ В TELEGRAM</a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Как только пользователь кликнул по кнопке, шторка Mini App закрывается, уступая место встроенному браузеру Telegram
        document.getElementById('watch-link').addEventListener('click', function() {
            setTimeout(() => {
                tg.close();
            }, 600);
        });
    </script>

</body>
</html>
