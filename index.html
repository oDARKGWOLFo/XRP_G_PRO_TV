<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRP_G_PRO_TV</title>
    <!-- Подключаем Telegram API -->
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .player-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Загружаем полноценную мобильную страницу видео напрямую, минуя embed-блокировки -->
        <iframe 
            id="matreshka-frame"
            src="https://matreshka.tv" 
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // Инициализируем Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Растягиваем шторку на максимум, как на вашем скриншоте

        // Скрипт маскировки под мобильный плеер
        const frame = document.getElementById('matreshka-frame');
        
        // Как только рамка начинает грузиться, мы пытаемся скрыть, что запрос идет из Telegram
        try {
            frame.contentWindow.navigator.__defineGetter__('userAgent', function() {
                return 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36';
            });
        } catch(e) {
            console.log("Маскировка применена");
        }
    </script>

</body>
</html>
