<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        /* Делаем страницу кликабельной по всей площади */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer; /* Показывает, что на экран можно нажать */
        }
        .loader {
            border: 4px solid #222;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            margin: 0 0 8px 0;
        }
        p {
            font-size: 14px;
            color: #3498db;
            margin: 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>XRP G PRO TV</h2>
    <p>Нажмите в любое место экрана для запуска плеера</p>

    <script>
        // Инициализируем Telegram Mini App API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const targetVideoUrl = "https://matreshka.tv";

        // Функция запуска видео, которая сработает железно по касанию экрана
        function startVideo() {
            try {
                tg.openLink(targetVideoUrl);
            } catch (e) {
                window.location.href = targetVideoUrl;
            }

            // Закрываем Mini App, уступая место встроенному плееру Telegram
            setTimeout(() => {
                tg.close();
            }, 600);
        }

        // Вешаем запуск на абсолютно любое нажатие по экрану шторки
        document.body.addEventListener('click', startVideo);
        document.body.addEventListener('touchstart', startVideo);
    </script>

</body>
</html>
