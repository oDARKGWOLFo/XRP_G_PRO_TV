<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <!-- Подключаем Telegram API -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Перенаправление на Матрёшка ТВ...<br><small style="color: #888;">Видео откроется в браузере смартфона</small></p>

    <script>
        // Инициализируем Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Ссылка на ваше видео для начисления просмотров
        const targetVideoUrl = "https://matreshka.tv";

        // Запуск перенаправления во внешний браузер смартфона
        tg.openLink(targetVideoUrl);

        // Закрываем шторку Mini App через секунду, чтобы она не оставалась пустой
        setTimeout(() => {
            tg.close();
        }, 1000);
    </script>

</body>
</html>
