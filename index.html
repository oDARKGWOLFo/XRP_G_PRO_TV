<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* Создаем полноэкранный контейнер для обхода блокировки WebView */
        .embed-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="embed-container">
        <!-- Тег embed с типом приложения заставляет Android загружать плеер в режиме совместимости внутри шторки -->
        <embed src="https://matreshka.tv" type="text/html">
    </div>

    <script>
        // Инициализируем Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Сразу растягиваем шторку на весь экран телефона
    </script>

</body>
</html>
