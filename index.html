<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Запуск видеоплеера...<br><small style="color: #888;">Пожалуйста, подождите</small></p>

    <script>
        // Инициализируем Telegram Mini App API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Ссылка на Матрёшка ТВ, где должны копиться просмотры
        const targetVideoUrl = "https://matreshka.tv";

        // Программный вызов встроенного браузера мессенджера (без кликов по кнопкам)
        try {
            tg.openLink(targetVideoUrl);
        } catch (e) {
            // Резервный метод на случай сбоя API
            window.location.href = targetVideoUrl;
        }

        // Закрываем фоновое Mini App через 1.5 секунды, чтобы дать шторке плеера полностью развернуться
        setTimeout(() => {
            tg.close();
        }, 1500);
    </script>

</body>
</html>
