<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .player-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16/9;
            background-color: #000000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        /* Стандартный HTML5 плеер, одобренный Telegram */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h2 {
            font-size: 18px;
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Плеер будет читать видеофайл с именем video.mp4 из вашего репозитория -->
        <video id="tg-player" controls autoplay playsinline>
            <source src="video.mp4" type="video/mp4">
            Ваш браузер не поддерживает встроенный плеер.
        </video>
    </div>
    
    <h2>XRP G PRO TV | Эксклюзивно в Telegram</h2>

    <script>
        // Инициализируем Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем шторку на максимум
    </script>

</body>
</html>
