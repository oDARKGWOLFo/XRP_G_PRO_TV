<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            transition: transform 0.1s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        p {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>XRP G PRO TV</h2>
    <p>Нажмите на кнопку ниже, чтобы запустить видео на платформе Матрёшка ТВ и поддержать автора просмотром!</p>

    <!-- Большая удобная кнопка для обхода блокировок -->
    <button class="btn" id="watch-btn">▶ СМОТРЕТЬ ВИДЕО</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const targetVideoUrl = "https://matreshka.tv";

        // Перенаправление сработает ТОЛЬКО по клику пользователя, что обойдет зависание
        document.getElementById('watch-btn').addEventListener('click', function() {
            tg.openLink(targetVideoUrl);
            
            // Даем пользователю полсекунды, чтобы браузер успел подхватить ссылку, и закрываем шторку
            setTimeout(() => {
                tg.close();
            }, 500);
        });
    </script>

</body>
</html>
