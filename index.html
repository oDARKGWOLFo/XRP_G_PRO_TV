<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        /* Превращаем ссылку-контейнер в полноценный полноэкранный блок */
        .fullscreen-link {
            text-decoration: none;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }
        .loader {
            border: 4px solid #222;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #3498db;
            margin: 0;
            font-weight: 500;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background-color: #0b0b0e;">

    <!-- Весь экран теперь является ссылкой. Атрибут target="_blank" заставляет Telegram открыть встроенное окно поверх чата -->
    <a href="https://matreshka.tv" target="_blank" class="fullscreen-link" id="main-clicker">
        <div class="loader"></div>
        <h2>XRP G PRO TV</h2>
        <p>Нажмите в любое место экрана для запуска видео</p>
    </a>

    <script>
        // Инициализируем Telegram Mini App API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // При клике по экрану ссылка сработает нативно, а мы плавно закроем Mini App через секунду
        document.getElementById('main-clicker').addEventListener('click', function() {
            setTimeout(() => {
                tg.close();
            }, 1000);
        });
    </script>

</body>
</html>
