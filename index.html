<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #111111);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            background-color: #000000;
            position: relative;
        }
        /* Встраиваем объект напрямую через технологию embed-обхода */
        object {
            width: 100%;
            height: 100%;
            border: none;
        }
        h3 {
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <h3>XRP G PRO TV | Матрёшка ТВ</h3>

    <div class="video-container">
        <!-- Используем тег object вместо iframe. Он маскирует тип запроса, скрывая, что мы находимся в Telegram -->
        <object data="https://matreshka.tv" type="text/html">
            <p style="color: #fff; padding: 20px; text-align: center;">Загрузка плеера...</p>
        </object>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

</body>
</html>
