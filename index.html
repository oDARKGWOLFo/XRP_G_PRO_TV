<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP_G_PRO_TV</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #111111;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            transition: transform 0.1s ease;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        p {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>XRP G PRO TV</h2>
    <p>Нажмите на кнопку ниже, чтобы запустить видео внутри встроенного плеера Telegram!</p>

    <!-- Обычная кнопка, которая теперь будет обрабатываться скриптом правильно -->
    <button class="btn" id="watch-button">▶ СМОТРЕТЬ В TELEGRAM</button>

    <script>
        // Инициализируем Telegram Web App API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const targetVideoUrl = "https://matreshka.tv";

        document.getElementById('watch-button').addEventListener('click', function() {
            // Классический проверенный метод с флагом встроенного браузера
            tg.openLink(targetVideoUrl, {try_instant_view: true});
            
            // Закрываем шторку Mini App, пока грузится встроенное видео
            setTimeout(() => {
                tg.close();
            }, 600);
        });
    </script>

</body>
</html>
